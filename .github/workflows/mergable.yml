name: Mergable
on:
  push: { branches: [ main, develop ] }
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}   # ← enables the button


permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # run on push, non-draft PRs, and manual runs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          brew install swiftlint || true
          swiftlint --strict --no-cache

  docs:
    # run on push, non-draft PRs, and manual runs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: DocC build
        run: |
          xcodebuild docbuild \
            -workspace "Typeground.xcworkspace" \
            -scheme "Typeground" \
            -destination 'generic/platform=iOS' | xcpretty
